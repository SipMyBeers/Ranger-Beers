<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0006">
  <title>Ranger Tab Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0006;
      --text: #999;
      --text-bright: #e5e5e5;
      --text-muted: #444;
      --gold: #C5B358;
      --font: 'JetBrains Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: var(--bg); overflow-x: clip; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    .hero { position: relative; width: 100%; height: 100svh; min-height: 540px; overflow: hidden; background: var(--bg); }
    .hero-game { position: absolute; inset: 0; z-index: 0; }
    .hero-intro { position: absolute; top: clamp(32px, 6vh, 56px); left: clamp(16px, 4vw, 48px); z-index: 10; pointer-events: none; }
    .intro-name { font-size: clamp(14px, 1.8vw, 18px); font-weight: 800; letter-spacing: 4px; color: var(--text-bright); margin-bottom: clamp(16px, 3vh, 28px); }
    .intro-roles p { font-size: clamp(11px, 1.4vw, 14px); font-weight: 500; letter-spacing: 2px; line-height: 1.8; text-transform: uppercase; }
    .intro-roles s { color: var(--text-muted); text-decoration-thickness: 1.5px; margin-right: 8px; }
    .after { min-height: 120vh; padding: 64px clamp(16px, 4vw, 48px); border-top: 1px solid rgba(255,255,255,0.06); }
    .after h2 { color: var(--gold); font-size: 12px; letter-spacing: 3px; font-weight: 500; }
  </style>
</head>
<body>
  <section class="hero" id="hero">
    <div class="hero-game" id="game-container"></div>
    <div class="hero-intro">
      <h1 class="intro-name">RANGER BEERS</h1>
      <div class="intro-roles">
        <p><s>VIBE CODER</s> FULL-STACK BUILDER.</p>
        <p>AIRBORNE RANGER MEDIC.</p>
        <p>SOLO FOUNDER, 11 PRODUCTS SHIPPED.</p>
        <p>FORCE MULTIPLIER.</p>
      </div>
    </div>
  </section>
  <section class="after"><h2>WORK</h2></section>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import { mount } from '../../js/ranger-tab/hero.js';
    const q = new URLSearchParams(location.search);
    const hero = mount(document.getElementById('game-container'), {
      motion: q.get('motion') === 'on', palette: q.get('palette') || 'reference',
      quietEl: document.querySelector('.hero-intro'),
    });
    window.__rangerTab = hero;
  </script>
</body>
</html>
